<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bark 通知ボタン</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --sub: #6e6e73;
    --accent: #ff5a36; --border: #e0e0e5; --ok: #2e9e5b; --ng: #d93a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --card: #1c1c1e; --text: #f5f5f7; --sub: #a1a1a6; --border: #333; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 4px 0 16px; }
  h2 { font-size: 15px; color: var(--sub); margin: 0 0 10px; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
          padding: 16px; margin-bottom: 16px; }
  input, select { width: 100%; padding: 10px 12px; font-size: 16px; border-radius: 10px;
          border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  label { font-size: 13px; color: var(--sub); display: block; margin: 10px 0 4px; }
  button { font: inherit; cursor: pointer; border: none; border-radius: 10px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .friends { display: flex; flex-wrap: wrap; gap: 8px; }
  .friend { padding: 8px 14px; border: 1px solid var(--border); background: var(--bg);
            color: var(--text); border-radius: 999px; }
  .friend.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .quick button { aspect-ratio: 1; font-size: 44px; line-height: 1; position: relative;
                  background: var(--bg); border: 1px solid var(--border); border-radius: 18px;
                  transition: transform .08s; }
  .quick button:active { transform: scale(.9); }
  .quick button.shake { animation: shake .35s; }
  .quick .count { position: absolute; top: 6px; right: 8px; font-size: 13px; font-weight: 700;
                  color: #fff; background: var(--accent); border-radius: 999px; padding: 2px 7px;
                  opacity: 0; transition: opacity .2s; }
  .quick .count.show { opacity: 1; }
  @keyframes shake {
    0%, 100% { transform: rotate(0) scale(1); }
    20% { transform: rotate(-12deg) scale(1.08); }
    40% { transform: rotate(10deg) scale(1.08); }
    60% { transform: rotate(-7deg) scale(1.04); }
    80% { transform: rotate(4deg); }
  }
  .fly { position: fixed; font-size: 36px; pointer-events: none; z-index: 10; will-change: transform, opacity; }
  .send:active { transform: scale(.97); }
  .send { width: 100%; padding: 14px; margin-top: 12px; background: var(--text); color: var(--bg); font-weight: 600; }
  .sub-btn { padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .del { color: var(--ng); }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
           padding: 10px 18px; border-radius: 999px; color: #fff; font-size: 14px;
           opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  .hint { font-size: 12px; color: var(--sub); line-height: 1.6; }
  details summary { cursor: pointer; color: var(--sub); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>🔔 Bark 通知ボタン</h1>

  <div class="card">
    <h2>送る相手</h2>
    <div class="friends" id="friends"></div>
    <p class="hint" id="noFriend">まだ友達がいません。下の「友達を追加」から登録してね。</p>
  </div>

  <div class="card">
    <h2>ワンタップ通知</h2>
    <div class="quick" id="quick"></div>
  </div>

  <div class="card">
    <h2>自由メッセージ</h2>
    <input id="msg" placeholder="メッセージを入力" maxlength="200">
    <div class="row">
      <div>
        <label>音</label>
        <select id="sound">
          <option value="">デフォルト</option>
          <option value="alarm">alarm</option>
          <option value="bell">bell</option>
          <option value="birdsong">birdsong</option>
          <option value="calypso">calypso</option>
          <option value="glass">glass</option>
          <option value="minuet">minuet</option>
          <option value="shake">shake</option>
        </select>
      </div>
      <div>
        <label>重要度</label>
        <select id="level">
          <option value="active">通常</option>
          <option value="timeSensitive">至急（集中モード貫通）</option>
          <option value="passive">静か</option>
        </select>
      </div>
    </div>
    <button class="send" id="sendBtn">送信</button>
  </div>

  <div class="card">
    <details>
      <summary>⚙️ 設定（自分の名前・友達を追加）</summary>
      <label>自分の名前（通知のタイトルに出ます）</label>
      <input id="myName" placeholder="例: たろう">

      <label>友達の名前</label>
      <input id="fName" placeholder="例: はなこ">
      <label>友達の Bark キー（またはBarkアプリに出るURLをそのまま貼り付け）</label>
      <input id="fKey" placeholder="https://api.day.app/xxxxxxxx/...">
      <button class="sub-btn" id="addBtn" style="width:100%;margin-top:10px">友達を追加</button>
      <button class="sub-btn del" id="delBtn" style="width:100%;margin-top:8px">選択中の友達を削除</button>

      <label>Bark サーバー（自前サーバーの人だけ変更）</label>
      <input id="server" placeholder="https://api.day.app">
      <p class="hint">
        データ（名前・キー）はこのブラウザ内にだけ保存されます。<br>
        Barkキーを知っている人は誰でもその端末に通知を送れるので、信頼できる友達とだけ交換してね。
      </p>
    </details>
  </div>
</main>
<div id="toast"></div>

<script>
const QUICK = [
  { emoji: "👋", body: "👋 やっほー！" },
  { emoji: "📞", body: "📞 電話してほしい！", level: "timeSensitive" },
  { emoji: "🍜", body: "🍜 ごはん行かない？" },
  { emoji: "🎮", body: "🎮 ゲームしよう！" },
  { emoji: "🏠", body: "🏠 着いたよ" },
  { emoji: "😴", body: "😴 おやすみ〜", level: "passive" },
];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let friends = store.get("friends", []);
let selected = store.get("selected", 0);
const $ = id => document.getElementById(id);

$("myName").value = store.get("myName", "");
$("server").value = store.get("server", "");
$("myName").oninput = e => store.set("myName", e.target.value.trim());
$("server").oninput = e => store.set("server", e.target.value.trim());

function renderFriends() {
  const box = $("friends");
  box.innerHTML = "";
  friends.forEach((f, i) => {
    const b = document.createElement("button");
    b.className = "friend" + (i === selected ? " on" : "");
    b.textContent = f.name;
    b.onclick = () => { selected = i; store.set("selected", i); renderFriends(); };
    box.appendChild(b);
  });
  $("noFriend").style.display = friends.length ? "none" : "block";
}

// URLを貼られてもキー部分だけ取り出す
function parseKey(input) {
  const s = input.trim();
  const m = s.match(/^https?:\/\/[^/]+\/([^/?#]+)/);
  return m ? m[1] : s;
}

$("addBtn").onclick = () => {
  const name = $("fName").value.trim();
  const key = parseKey($("fKey").value);
  if (!name || !key) return toast("名前とキーを入力してね", false);
  friends.push({ name, key });
  selected = friends.length - 1;
  store.set("friends", friends); store.set("selected", selected);
  $("fName").value = ""; $("fKey").value = "";
  renderFriends();
  toast(name + " を追加しました", true);
};

$("delBtn").onclick = () => {
  const f = friends[selected];
  if (!f || !confirm(f.name + " を削除しますか？")) return;
  friends.splice(selected, 1);
  selected = 0;
  store.set("friends", friends); store.set("selected", selected);
  renderFriends();
};

// 1タップ = 1通知。前の送信を待たずに即送る
async function send(body, opts = {}) {
  const f = friends[selected];
  if (!f) { toast("先に友達を追加してね", false); return false; }
  const me = store.get("myName", "") || "だれか";
  const server = (store.get("server", "") || "https://api.day.app").replace(/\/+$/, "");
  const params = new URLSearchParams({ group: "友達通知" });
  if (opts.sound) params.set("sound", opts.sound);
  if (opts.level) params.set("level", opts.level);
  const url = `${server}/${encodeURIComponent(f.key)}/${encodeURIComponent(me + " から")}/${encodeURIComponent(body)}?${params}`;

  try {
    const res = await fetch(url, { keepalive: true });
    const data = await res.json().catch(() => ({}));
    if (res.ok && (data.code === undefined || data.code === 200)) {
      if (!opts.quiet) toast(f.name + " に送信しました ✓", true);
      return true;
    }
    toast("送信失敗: " + (data.message || res.status), false);
  } catch {
    toast("送信失敗（キーが間違ってるかも）", false);
  }
  return false;
}

// iPhoneの触覚フィードバック（iOS 18以降のSafariで switch を押すと振動する仕組みを利用）
const hapticInput = document.createElement("input");
hapticInput.type = "checkbox";
hapticInput.setAttribute("switch", "");
hapticInput.id = "haptic";
const hapticLabel = document.createElement("label");
hapticLabel.htmlFor = "haptic";
const hapticBox = document.createElement("div");
hapticBox.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0;pointer-events:none";
hapticBox.append(hapticInput, hapticLabel);
document.body.appendChild(hapticBox);
function haptic() {
  try { if (navigator.vibrate) navigator.vibrate(15); else hapticLabel.click(); } catch {}
}

function burst(btn, emoji) {
  const r = btn.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 6; i++) {
    const s = document.createElement("span");
    s.className = "fly";
    s.textContent = emoji;
    document.body.appendChild(s);
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.8;
    const dist = 120 + Math.random() * 160;
    const dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist;
    const rot = (Math.random() - 0.5) * 120;
    const scale = 0.6 + Math.random() * 0.8;
    s.style.left = cx - 18 + "px";
    s.style.top = cy - 22 + "px";
    s.animate([
      { transform: "translate(0,0) scale(.4) rotate(0)", opacity: 1 },
      { transform: `translate(${dx * .6}px,${dy * .6}px) scale(${scale}) rotate(${rot / 2}deg)`, opacity: 1, offset: .6 },
      { transform: `translate(${dx}px,${dy}px) scale(${scale * .8}) rotate(${rot}deg)`, opacity: 0 },
    ], { duration: 700 + Math.random() * 300, easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => s.remove();
  }
}

QUICK.forEach(q => {
  const b = document.createElement("button");
  b.setAttribute("aria-label", q.body);
  b.textContent = q.emoji;
  const badge = document.createElement("span");
  badge.className = "count";
  b.appendChild(badge);
  let combo = 0, comboTimer;

  b.addEventListener("click", () => {
    if (!friends[selected]) return toast("先に友達を追加してね", false);
    haptic();
    b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
    burst(b, q.emoji);

    combo++;
    badge.textContent = "×" + combo;
    badge.classList.add("show");
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => { combo = 0; badge.classList.remove("show"); }, 1500);

    send(q.body, { level: q.level, quiet: true });
  });
  $("quick").appendChild(b);
});

$("sendBtn").onclick = () => {
  const body = $("msg").value.trim();
  if (!body) return toast("メッセージを入力してね", false);
  send(body, { sound: $("sound").value, level: $("level").value });
  $("msg").value = "";
};
$("msg").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) $("sendBtn").click(); });

let tt;
function toast(text, ok) {
  const t = $("toast");
  t.textContent = text;
  t.style.background = ok ? "var(--ok)" : "var(--ng)";
  t.classList.add("show");
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2200);
}

renderFriends();
</script>
</body>
</html>
